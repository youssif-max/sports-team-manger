name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Deliberately no database or secrets here: lint, type-check and unit
      # tests only. Deploys and migrations happen on Vercel.
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
